services:
  - type: web
    name: college-discovery-platform-api
    runtime: node
    branch: main
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: 22.15.0
